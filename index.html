<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculadora Patrimonio Feliz</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="contenedor">

<header>

<img src="logo.png" class="logo">

<h1>Resumen Financiero Infonavit</h1>

<p>Patrimonio Feliz</p>

</header>

<section class="formulario">

<h2>Datos del Cliente</h2>

<div class="fila">
<label>Nombre del Cliente</label>
<input type="text" id="cliente">
</div>

<div class="fila">
<label>Saldo en Subcuenta</label>
<input type="number" id="subcuenta">
</div>

<div class="fila">
<label>Crédito Autorizado</label>
<input type="number" id="credito">
</div>

<div class="fila">
<label>Pago Mensual</label>
<input type="number" id="mensual">
</div>

<div class="fila">
<label>Tipo de Pago</label>

<select id="tipoPago">

<option value="Semanal">Semanal</option>

<option value="Quincenal">Quincenal</option>

<option value="Mensual">Mensual</option>

</select>

</div>

<div class="fila">
<label>Meses</label>
<input type="number" id="meses">
</div>

<div class="fila">
<label>Honorarios (%)</label>
<input type="number" id="honorarios" value="15">
</div>

<div class="fila">
<label>Gastos de Originación</label>
<input type="number" id="originacion" value="4500">
</div>

<button onclick="generarResumen()">

GENERAR INFOGRAFÍA

</button>

</section>

<section id="resultado">

</section>

</div>

<script src="script.js"></script>

</body>

</html>
